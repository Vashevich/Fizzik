<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Fizzik</title>
<style>
  :root{--bg:#f6f7fa;--panel:#ffffff;--ink:#16181d;--mute:#7b818f;--line:#e6e8ee;--soft:#f3f4f7;--acc:#ff5a2b;--accSoft:#fff0eb;--blue:#2f6bff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{display:flex;height:100%}
  #panel{width:232px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 12px 16px;overflow:auto;scrollbar-width:thin}
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
  #panel h1{font-size:18px;margin:0;letter-spacing:-.02em;font-weight:750}
  #panel .sub{color:var(--mute);font-size:11px}
  section{border-top:1px solid var(--line);padding:10px 0 2px}
  h2{display:flex;align-items:center;gap:6px;margin:0 0 7px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  button{font:inherit;color:inherit;background:var(--soft);border:1px solid transparent;border-radius:8px;padding:6px 8px;cursor:pointer;transition:background .12s,color .12s}
  button:hover{background:#e9ebf0}
  button.on{background:var(--ink);color:#fff}
  #tools button.on,#mtools button.on{background:var(--acc);color:#fff}
  #pause.on{background:var(--acc);color:#fff}
  button:disabled{opacity:.35;cursor:default}
  button.ico{width:32px;padding:6px 0;flex:none}
  .row,.pauseRow{display:flex;gap:5px;margin-bottom:10px}
  .pauseRow .wide{flex:1;font-weight:600}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
  .grid3 button{padding:7px 2px;font-size:12.5px}
  .seg{display:flex;background:var(--soft);border-radius:9px;padding:2px;gap:2px;margin:0 0 7px}
  .seg button{flex:1;background:transparent;padding:5px 2px;border-radius:7px;font-size:12px}
  .seg button:hover{background:#fff}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,24,40,.14);font-weight:600}
  .row2{display:flex;gap:5px;align-items:center;margin:0 0 6px}
  .row2 .lbl{width:44px;color:var(--mute);font-size:12px}
  .row2 button{flex:1;padding:5px 2px;font-size:12px}
  .row2 .chk{flex:1;margin:0}
  label.sl{display:flex;align-items:center;gap:7px;margin:2px 0 6px;font-size:12px;color:var(--mute)}
  label.sl span{width:44px;flex:none}
  label.sl b{width:30px;text-align:right;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;font-size:11.5px}
  input[type=range]{flex:1;min-width:0;accent-color:var(--acc);margin:0;height:18px}
  input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;margin:0}
  .chk{display:flex;gap:7px;align-items:center;margin:0 0 6px;font-size:12.5px;cursor:pointer}
  .chk label{display:flex;gap:7px;align-items:center;flex:1;cursor:pointer}
  select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:2px 4px;background:#fff;color:var(--ink)}
  i.tip{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid #cfd3dc;color:var(--mute);font-size:10px;font-weight:700;text-transform:none;letter-spacing:0;cursor:help;flex:none;font-family:Georgia,serif}
  i.tip:hover,i.tip.open{background:var(--ink);border-color:var(--ink);color:#fff}
  #tipBox{position:fixed;z-index:50;max-width:250px;background:var(--ink);color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:9px;box-shadow:0 8px 24px rgba(10,12,20,.25);pointer-events:none;opacity:0;transform:translateY(-3px);transition:opacity .12s,transform .12s}
  #tipBox.show{opacity:1;transform:none}
  #stage{flex:1;position:relative;overflow:hidden;min-width:0;background:var(--bg)}
  canvas{position:absolute;inset:0;display:block;touch-action:none}
  #frame{position:absolute;border:1px dashed var(--acc);background:rgba(255,90,43,.08);pointer-events:none;display:none}
  #pauseBadge{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--acc);color:#fff;border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:650;pointer-events:none;display:none}
  body.paused #pauseBadge{display:block}
  body.paused #stage{box-shadow:inset 0 0 0 2px var(--acc)}
  #legBtn{position:absolute;right:10px;top:10px;width:28px;height:28px;padding:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(20,24,40,.15);font-weight:700;color:var(--mute)}
  body.legend #legBtn{background:var(--ink);color:#fff}
  #legend{position:absolute;right:10px;top:44px;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(10,12,20,.15);padding:8px 11px;font-size:12px;color:var(--ink);pointer-events:none;line-height:1.75;display:none}
  body.legend #legend{display:block}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
  #legend i.sq{border-radius:2px}
  #legend .small{font-size:11px;color:var(--mute);line-height:1.3;margin:2px 0}
  #hint{display:none}
  #mbar,#sheetHead{display:none}
  /* телефон: сцена на весь экран, панель — шторка снизу, внизу строка инструментов */
  @media (max-width: 760px){
    html,body{overflow:hidden;font-size:14px}
    #app{display:block}
    #stage{position:fixed;left:0;right:0;top:0;bottom:calc(58px + env(safe-area-inset-bottom))}
    #mbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom));padding:7px 6px calc(7px + env(safe-area-inset-bottom));gap:6px;background:var(--panel);border-top:1px solid var(--line);z-index:30;align-items:center}
    #mbar button{flex:none;height:44px;padding:0 13px;white-space:nowrap;border-radius:10px}
    #mbar .ico{width:44px;padding:0;font-size:18px}
    #mPause.on{background:var(--acc);color:#fff}
    #mtools{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    #mtools::-webkit-scrollbar{display:none}
    #panel{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));width:auto;max-height:64vh;border-right:0;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(10,12,20,.15);z-index:20;transform:translateY(110%);transition:transform .22s ease;padding-top:0}
    body.sheet #panel{transform:none}
    #sheetHead{display:flex;position:sticky;top:0;background:var(--panel);padding:10px 0 8px;align-items:center;justify-content:space-between;z-index:1}
    #sheetHead b{font-size:15px}
    #panel .head,#panel .pauseRow,#panel section.tools{display:none}
    #panel button{min-height:38px}
    .seg button{min-height:34px}
    label.sl input{height:28px}
    input[type=checkbox]{width:20px;height:20px}
    #legBtn{width:34px;height:34px}
    #legend{top:52px;font-size:13px}
    #pauseBadge{left:12px;transform:none;top:14px}
  }
</style>
<script type="importmap">
{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/"}}
</script>
</head>
<body>
<div id="app">
  <div id="panel">
    <div id="sheetHead"><b>Настройки</b><button id="sheetClose" class="ico" title="Закрыть">✕</button></div>
    <header class="head">
      <div><h1>Fizzik</h1><div class="sub">«Rock-Parametric»</div></div>
      <i class="tip" data-tip="Рисовалка с физикой в 3D. Нарисованное сразу падает и держит форму. Пауза (пробел) — всё замирает, можно спокойно строить. Ctrl+Z / Ctrl+Y — назад и вперёд, Delete — удалить выбранное, G — привязка к сетке.">i</i>
    </header>

    <div class="row pauseRow">
      <button id="pause" class="wide" title="Пауза (пробел)">⏸ Пауза</button>
      <button id="stepBtn" class="ico" disabled title="Один кадр расчёта (на паузе)">⏭</button>
      <button id="undo" class="ico" title="Назад (Ctrl+Z)">↶</button>
      <button id="redo" class="ico" title="Вперёд (Ctrl+Y)">↷</button>
    </div>

    <section class="tools">
      <div class="grid3" id="tools">
        <button data-tool="draw" class="on">Рисовать</button>
        <button data-tool="point">Точка</button>
        <button data-tool="connect">Соединить</button>
        <button data-tool="select">Выбрать</button>
        <button data-tool="pull">Тянуть</button>
        <button data-tool="view">Камера</button>
        <button data-tool="anchor">Якорь</button>
        <button data-tool="angle">Угол</button>
        <button data-tool="erase">Стереть</button>
      </div>
    </section>

    <section>
      <h2>Рисование <i class="tip" data-tip="Новые фигуры сразу получают гравитацию и жёсткие углы — можно выключить. Оси как в Rhino: Z вверх. Плоскость: «Вид» — перпендикулярно взгляду, как на экране, без сетки; XY — горизонтальная (как пол), XZ — фронтальная, YZ — боковая, с сеткой. Плоскость проходит через центр обзора и не меняется, пока тянете штрих. Привязка ставит точки и гизмо в узлы 3D-сетки.">i</i></h2>
      <label class="chk"><input type="checkbox" id="autoLoad" checked> Гравитация</label>
      <label class="chk"><input type="checkbox" id="autoAngle" checked> Жёсткие углы</label>
      <div class="chk"><label><input type="checkbox" id="snap"> Сетка</label>
        <select id="snapStep" title="Шаг сетки">
          <option value="0.1">0.1 м</option>
          <option value="0.25">0.25 м</option>
          <option value="0.5" selected>0.5 м</option>
          <option value="1">1 м</option>
        </select></div>
      <div class="seg" id="planes">
        <button data-plane="VIEW" class="on" title="Перпендикулярно взгляду">Вид</button>
        <button data-plane="XY">XY</button>
        <button data-plane="XZ">XZ</button>
        <button data-plane="YZ">YZ</button>
      </div>
    </section>

    <section>
      <h2>Нагрузка <i class="tip" data-tip="Вектор силы для выбранных точек (если ничего не выбрано — для всех). Направление — кнопкой (оси как в Rhino: ↓ = −Z), сила — ползунком от 0 до 2. «✕» снимает нагрузку. Точки с нагрузкой синие.">i</i></h2>
      <div class="seg" id="dirs">
        <button data-d="0,-1,0" title="Вниз, −Z (гравитация)">↓</button>
        <button data-d="0,1,0" title="Вверх, +Z">↑</button>
        <button data-d="-1,0,0" title="−X">−X</button>
        <button data-d="1,0,0" title="+X">+X</button>
        <button data-d="0,0,1" title="−Y (к зрителю на виде спереди)">−Y</button>
        <button data-d="0,0,-1" title="+Y (вглубь на виде спереди)">+Y</button>
        <button id="loadOff" title="Снять нагрузку">✕</button>
      </div>
      <label class="sl"><span>Сила</span><input type="range" id="load" min="0" max="2" step="0.05" value="1"><b id="loadVal">1.00</b></label>
    </section>

    <section>
      <h2>Связи <i class="tip" data-tip="Якорь закрепляет выбранные точки (рамка в «Выбрать»). Одна закреплённая точка у жёсткой фигуры работает как шарнир. Длина: 0 — как нарисовано, 1 — вдвое длиннее, −1 — вдвое короче (выбранные линии или все); изменённые линии зелёные. Угол: фиксирует углы в выбранных точках; пружинность 0 — жёсткое тело, больше — угол поддаётся. Точки с углом и без нагрузки фиолетовые.">i</i></h2>
      <div class="row2"><span class="lbl">Якорь</span><button id="anchorOn" title="Закрепить выбранные">Закрепить</button><button id="anchorOff" title="Отпустить выбранные">Отпустить</button></div>
      <div class="row2"><span class="lbl">Угол</span><button id="angleOn" title="Зафиксировать углы в выбранных точках">Зафикс.</button><button id="angleOff" title="Снять фиксацию">Снять</button></div>
      <label class="sl"><span>Длина</span><input type="range" id="spring" min="-1" max="1" step="0.05" value="0"><b id="springVal">0.00</b></label>
      <label class="sl"><span>Пружин.</span><input type="range" id="angleSoft" min="0" max="1" step="0.05" value="0"><b id="angleSoftVal">0.00</b></label>
    </section>

    <section>
      <h2>Сцена <i class="tip" data-tip="Пол есть всегда. Потолок на высоте 3 м. Предмет — параллелепипед, его двигают гизмо (инструмент «Выбрать»). Камера: правая кнопка — вращать, колесо — приблизить, средняя — сдвинуть; на телефоне — двумя пальцами или инструментом «Камера».">i</i></h2>
      <div class="row2"><label class="chk"><input type="checkbox" id="ceil"> Потолок</label><button id="addBox">+ Предмет</button></div>
      <div class="seg"><button id="vFront">Спереди</button><button id="vTop">Сверху</button><button id="vReset">Сброс</button></div>
    </section>

    <section>
      <h2>Файл <i class="tip" data-tip="JSON — вся работа, чтобы открыть и продолжить. OBJ — линии и точки в текущем положении (1 = 1 м, ось Z вверх, как в Rhino). PNG — картинка сцены.">i</i></h2>
      <div class="seg"><button id="expJson">JSON</button><button id="expObj">OBJ</button><button id="expPng">PNG</button></div>
      <div class="seg"><button id="openJson">Открыть…</button><button id="clear">Очистить</button></div>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </section>
  </div>
  <div id="mbar">
    <button id="mPause" class="ico" title="Пауза">⏸</button>
    <button id="mUndo" class="ico" title="Назад">↶</button>
    <div id="mtools">
      <button data-tool="draw" class="on">Рисовать</button>
      <button data-tool="view">Камера</button>
      <button data-tool="select">Выбрать</button>
      <button data-tool="pull">Тянуть</button>
      <button data-tool="point">Точка</button>
      <button data-tool="connect">Соединить</button>
      <button data-tool="anchor">Якорь</button>
      <button data-tool="angle">Угол</button>
      <button data-tool="erase">Стереть</button>
    </div>
    <button id="mMore" class="ico" title="Настройки и силы">☰</button>
  </div>
  <div id="stage"><canvas id="c"></canvas><div id="frame"></div><div id="pauseBadge">⏸ пауза</div><div id="hint"></div><button id="legBtn" title="Что значат цвета">?</button>
    <div id="legend">
      <div><i style="background:#2b6cb0"></i>точка с нагрузкой (падает)</div>
      <div><i style="background:#4a463d"></i>точка без сил (стоит)</div>
      <div><i style="background:#7b3fa0"></i>угол зафиксирован, нагрузки нет</div>
      <div><i class="sq" style="background:#c8421f"></i>якорь</div>
      <div><i style="background:#2f9e44"></i>пружина (линия изменена)</div>
      <div class="small">якорь или пружина вместе с другой силой — маленькие метки рядом</div>
      <div><i style="background:#ff5a2b"></i>выбрано</div>
    </div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './lib/OrbitControls.js';
import { TransformControls } from './lib/TransformControls.js';

const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const hintEl = document.getElementById('hint');

/* ---------- сцена ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
renderer.setClearColor(0xf6f7fa);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 300);
const HOME = { pos: new THREE.Vector3(4, 2.6, 6.5), target: new THREE.Vector3(0, 1.2, 0) };
camera.position.copy(HOME.pos);

const orbit = new OrbitControls(camera, cv);
orbit.target.copy(HOME.target);
orbit.mouseButtons = { LEFT: -1, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
// палец: один — рисует (камера не трогается), два — вращать и приблизить
orbit.touches = { ONE: -1, TWO: THREE.TOUCH.DOLLY_ROTATE };
orbit.update();

let W = 1, H = 1;
function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  camera.aspect = W / H;
  // узкий вертикальный экран: шире угол обзора, чтобы сцена помещалась по ширине
  camera.fov = camera.aspect < 1 ? Math.min(80, 2 * Math.atan(Math.tan(25 * Math.PI / 180) / camera.aspect * 0.8) * 180 / Math.PI) : 50;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd5e2, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(3, 6, 4); scene.add(sun);

const CEIL = 3;       // высота потолка, м
const HALF = 20;      // половина стороны пола, м (стены по краю)

const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, HALF * 2).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xe6eaf0 }));
floor.position.y = -0.002; scene.add(floor);
const grid = new THREE.GridHelper(HALF * 2, HALF * 2, 0xb8c0cd, 0xd3d9e2);
grid.position.y = 0.001; scene.add(grid);
const ceilMesh = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, HALF * 2).rotateX(Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x1d1b17, transparent: true, opacity: 0.06, side: THREE.DoubleSide }));
ceilMesh.position.y = CEIL; ceilMesh.visible = false; scene.add(ceilMesh);

// подсказка: плоскость рисования
const guide = new THREE.Mesh(new THREE.PlaneGeometry(8, 8),
  new THREE.MeshBasicMaterial({ color: 0xc8421f, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false }));
scene.add(guide);

// сетка на плоскости рисования (с привязкой) и резинка для «Соединить»
let gridHelper = null;
function rebuildGrid() {
  if (gridHelper) { scene.remove(gridHelper); gridHelper.geometry.dispose(); gridHelper.material.dispose(); }
  const size = 8;
  gridHelper = new THREE.GridHelper(size, Math.round(size / snapStep), 0xff5a2b, 0xffb59d);
  gridHelper.material.transparent = true; gridHelper.material.opacity = 0.5;
  gridHelper.material.depthWrite = false;
  scene.add(gridHelper);
}
const rubber = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineBasicMaterial({ color: 0xff5a2b }));
rubber.frustumCulled = false; rubber.visible = false; scene.add(rubber);

// стрелка нагрузки
const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 0, 0), 0.7, 0x2b6cb0, 0.18, 0.1);
arrow.visible = false;
scene.add(arrow);

/* ---------- состояние ---------- */
// у точки: f — назначенная нагрузка {dx,dy,dz,s} или null (тогда точка стоит на месте)
// углы: {a, b, c, t} — угол t в вершине b между линиями b–a и b–c сохраняется
const S = { points: [], links: [], angles: [], boxes: [], ceiling: false };
let loadStrength = 1;   // сила, которая назначается при нажатии направления
const sel = { points: new Set(), box: -1 };
let tool = 'draw';
let plane = 'VIEW';   // VIEW — плоскость вида (перпендикулярно взгляду)
let paused = false;
let drawing = null;       // {last, plane, moved}
let pullIdx = -1;
let frame = null;         // рамка выделения {x0,y0,x1,y1,shift}
let connectFrom = -1;     // «Соединить»: первая выбранная точка
let autoAngle = true, autoLoad = true;   // новые точки сразу получают нагрузку вниз   // «Рисовать» и «Соединить» сразу фиксируют углы
let snapOn = false, snapStep = 0.5;   // привязка к 3D-сетке
const pullTarget = new THREE.Vector3();
let pullPlane = null;
let tcDragging = false;

const STEP = 0.15;        // шаг между точками при рисовании, м
const SNAP = 12;          // px
const CAP = 8000;

/* ---------- инстансы для отрисовки ---------- */
const matStd = () => new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0 });
const pointMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 8), matStd(), CAP);
const anchorMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), matStd(), CAP);
const linkMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 8, 1), matStd(), CAP);
const markMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 6), matStd(), CAP * 4);   // метки сил у узла
for (const m of [pointMesh, anchorMesh, linkMesh, markMesh]) {

document.getElementById('angleOn').addEventListener('click', () => { fixAngles(selIdx()); pushHist(); });
document.getElementById('angleOff').addEventListener('click', () => { releaseAngles(selIdx()); pushHist(); });
const angleSoftEl = document.getElementById('angleSoft'), angleSoftVal = document.getElementById('angleSoftVal');
function softTargets() { const s = new Set(selIdx()); return S.angles.filter(g => s.has(g.b)); }
angleSoftEl.addEventListener('input', () => {
  const v = +angleSoftEl.value; angleSoftVal.textContent = v.toFixed(2);
  softTargets().forEach(g => { g.r = v; }); rigidDirty = true;
});
angleSoftEl.addEventListener('change', pushHist);
function syncAngleSoft() {
  const t = sel.points.size ? softTargets() : [];
  const v = t.length ? (t[0].r || 0) : 0;
  angleSoftEl.value = v; angleSoftVal.textContent = (+v).toFixed(2);
}

ceilEl.addEventListener('change', () => { S.ceiling = ceilEl.checked; ceilMesh.visible = S.ceiling; pushHist(); });
document.getElementById('addBox').addEventListener('click', () => {
  S.boxes.push({ x: 0, y: 0.35, z: 0, w: 1, h: 0.7, d: 1 });
  rebuildBoxes(); pushHist();
});
document.getElementById('undo').addEventListener('click', undo);
document.getElementById('redo').addEventListener('click', redo);
const pauseBtn = document.getElementById('pause'), stepBtn = document.getElementById('stepBtn');
function setPaused(v) {
  paused = v;
  document.body.classList.toggle('paused', v);
  pauseBtn.classList.toggle('on', v);
  pauseBtn.textContent = v ? '▶ Продолжить' : '⏸ Пауза';
  const mp = document.getElementById('mPause'); mp.textContent = v ? '▶' : '⏸'; mp.classList.toggle('on', v);
  stepBtn.disabled = !v;
  // при выходе из паузы скорости обнуляем: точки не «выстреливают» от правок
  if (!v) for (const p of S.points) { p.px = p.x; p.py = p.y; p.pz = p.z; }
}
pauseBtn.addEventListener('click', () => setPaused(!paused));
stepBtn.addEventListener('click', () => { if (paused) step(); });
document.getElementById('clear').addEventListener('click', () => {
  S.points = []; S.links = []; S.angles = []; S.boxes = []; sel.points.clear(); sel.box = -1;
  rebuildBoxes(); updateGizmo(); pushHist();
});
function view(pos, target) { camera.position.copy(pos); orbit.target.copy(target); orbit.update(); }
document.getElementById('vFront').addEventListener('click', () => view(new THREE.Vector3(0, 1.2, 8), new THREE.Vector3(0, 1.2, 0)));
document.getElementById('vTop').addEventListener('click', () => view(new THREE.Vector3(0.001, 10, 0.001), new THREE.Vector3(0, 0, 0)));
document.getElementById('vReset').addEventListener('click', () => view(HOME.pos, HOME.target));
function syncUI() { syncLoad(); ceilEl.checked = S.ceiling; ceilMesh.visible = S.ceiling; syncSpring(); }

window.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (e.key === 'Escape') { connectFrom = -1; rubber.visible = false; if (frame) { frame = null; showFrame(); } }
  else if (k === 'g' && !e.ctrlKey && !e.metaKey) { snapEl.checked = !snapEl.checked; applySnap(); }
  else if (e.code === 'Space') { e.preventDefault(); if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); setPaused(!paused); }
  else if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (k === 'delete' || k === 'backspace') {
    if (sel.points.size) {
      [...sel.points].sort((a, b) => b - a).forEach(erasePoint);
      sel.points.clear(); updateGizmo(); pushHist();
    } else if (sel.box >= 0) {
      S.boxes.splice(sel.box, 1); sel.box = -1; rebuildBoxes(); updateGizmo(); pushHist();
    }
  }
});

/* ---------- выгрузка ---------- */
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('expJson').addEventListener('click', () =>
  download('fizzik.json', new Blob([serialize()], { type: 'application/json' })));

document.getElementById('expObj').addEventListener('click', () => {
  let s = '# Fizzik: линии и точки (положение после провисания)\n# 1 единица = 1 м, ось Z вверх (как в Rhino)\no fizzik\n';
  S.points.forEach(p => { s += `v ${p.x.toFixed(4)} ${(p.z === 0 ? 0 : -p.z).toFixed(4)} ${p.y.toFixed(4)}\n`; });
  const used = new Set();
  S.links.forEach(l => { used.add(l.a); used.add(l.b); s += `l ${l.a + 1} ${l.b + 1}\n`; });
  S.points.forEach((_, i) => { if (!used.has(i)) s += `p ${i + 1}\n`; });
  download('fizzik.obj', new Blob([s], { type: 'text/plain' }));
});

document.getElementById('expPng').addEventListener('click', () => {
  // без гизмо и подсказки плоскости
  const g = guide.visible, h = tc.getHelper().visible, gr = gridHelper.visible, rb = rubber.visible;
  guide.visible = false; tc.getHelper().visible = false; gridHelper.visible = false; rubber.visible = false;
  renderer.render(scene, camera);
  cv.toBlob(b => { download('fizzik.png', b); }, 'image/png');
  guide.visible = g; tc.getHelper().visible = h; gridHelper.visible = gr; rubber.visible = rb;
});

const fileEl = document.getElementById('file');
document.getElementById('openJson').addEventListener('click', () => fileEl.click());
fileEl.addEventListener('change', () => {
  const f = fileEl.files[0]; fileEl.value = '';
  if (!f) return;
  f.text().then(t => {
    const o = JSON.parse(t);
    const fin = Number.isFinite;
    const ok = o && o.version === 2 && Array.isArray(o.points) && Array.isArray(o.links) &&
      o.points.every(p => fin(p.x) && fin(p.y) && fin(p.z)) &&
      o.links.every(l => Number.isInteger(l.a) && Number.isInteger(l.b) &&
        l.a >= 0 && l.b >= 0 && l.a < o.points.length && l.b < o.points.length && fin(l.L)) &&
      (o.angles === undefined || (Array.isArray(o.angles) && o.angles.every(g =>
        [g.a, g.b, g.c].every(v => Number.isInteger(v) && v >= 0 && v < o.points.length) && fin(g.t))));
    if (!ok) throw new Error('bad');
    restore(o); pushHist();
  }).catch(() => alert('Не удалось открыть файл: это не 3D-файл Fizzik.'));
});

/* ---------- цикл ---------- */
function tick() {
  if (!paused && !drawing) step();
  if (!tcDragging && sel.points.size) centroid(pivot.position);
  syncBoxes();
  // плоскость рисования и стрелка нагрузки
  const onPlane = tool === 'draw' || tool === 'point' || tool === 'connect';
  guide.visible = false;   // заливку плоскости не показываем — только сетку
  const pn = drawing ? drawing.planeName : plane;
  gridHelper.visible = onPlane && pn !== 'VIEW';   // «Вид» — просто вид, без сетки
  if (onPlane) {
    const n = planeNormal(drawing ? drawing.planeName : plane);
    planeCenter(guide.position);
    if (drawing) guide.position.copy(drawing.plane.projectPoint(guide.position, _p));
    guide.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
    gridHelper.position.copy(guide.position);
    // сетка: для «Вида» — та плоскость осей, что ближе всего к взгляду
    // GridHelper лежит горизонтально (= XY в осях Rhino); XZ и YZ — поворот в вертикаль
    gridHelper.rotation.set(pn === 'XZ' ? Math.PI / 2 : 0, 0, pn === 'YZ' ? Math.PI / 2 : 0);
  }
  // стрелка нагрузки у выбранных точек
  const fp = sel.points.size ? [...sel.points].map(i => S.points[i]).find(p => p && p.f && p.f.s > 0) : null;
  arrow.visible = !!fp;
  if (fp) {
    arrow.position.copy(centroid(_p));
    arrow.setDirection(_d.set(fp.f.dx, fp.f.dy, fp.f.dz).normalize());
    arrow.setLength(0.3 + 0.4 * fp.f.s, 0.18, 0.1);
  }
  updateVisuals();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

setTool('draw');
applySnap();
syncUI();
pushHist();
requestAnimationFrame(tick);

// для автопроверок
window.__fizzik = { get rigid() { return rigid; }, get marks() { return markMesh.count; },
  S, sel, tc, pivot, camera, orbit, step, serialize, restore, pushHist,
  project: (x, y, z) => { const s = toScreen(x, y, z); return { x: s.x, y: s.y, ok: s.ok }; },
  size: () => ({ W, H })
};
</script>
